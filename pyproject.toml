[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "go2-visual-harness-demo"
version = "0.5.0.dev3"
description = "A capability-driven robot harness with a Go2 MuJoCo adapter"
requires-python = ">=3.11,<3.13"
dependencies = [
    "mujoco==3.2.5",
    "numpy>=1.24,<2",
    "torch>=2.2,<3",
    "opencv-python>=4.8,<4.12",
    "Pillow>=10,<12",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]
video = ["imageio-ffmpeg==0.6.0"]

[project.scripts]
go2-demo = "go2_demo.__main__:main"
robot-harness = "go2_demo.__main__:main"

[tool.setuptools.packages.find]
include = ["go2_demo*"]

[tool.setuptools.package-data]
go2_demo = ["prompts/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["dataset: regression tests using downloaded, checksum-verified QUARD samples"]
