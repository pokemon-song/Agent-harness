<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1125" viewBox="0 0 2000 1125">
<title>具身智能 Agent 项目架构：程序判定子任务完成</title>
<desc>主决策模型负责目标、路线和动作。程序维护子任务状态，根据实测执行结果判断局部完成。按需记忆读者选择历史证据。Harness连接本地Go2控制和MuJoCo环境，最终任务由独立评分器判定。</desc>
